name: Publicar agendados

# Roda a cada 5 minutos e chama o painel para publicar o que estava agendado.
# O plano gratuito da Vercel só aceita cron 1x por dia; este agendador é gratuito.
# Precisa dos segredos do repositório: APP_URL (ex: https://app.bfffitnessatacado.com.br) e PUBLICAR_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o painel
        run: |
          # Mostra o código HTTP e o início da resposta (401 = segredo diferente do da Vercel, 404 = endereço errado, 5xx = erro no painel).
          codigo=$(curl --silent --show-error --max-time 90 -o resposta.txt -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.PUBLICAR_SECRET }}" "${{ secrets.APP_URL }}/api/cron/publicar-agendados" || echo "000")
          echo "HTTP $codigo"
          head -c 300 resposta.txt || true
          echo
          if [ "$codigo" = "000" ] || [ "$codigo" -ge 400 ]; then exit 1; fi
